<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>ApexVault</title>
  <link rel="stylesheet" href="dashboard.css">
</head>
<body>

  <!-- ========== LOGIN OVERLAY ========== -->
  <div class="login-overlay" id="loginOverlay">
    <div class="logo">🔥 ApexVault</div>
    <p>Loading your dashboard...</p>
    <div class="loading-bar"></div>
  </div>

  <!-- ========== LOGOUT OVERLAY ========== -->
  <div class="logout-overlay" id="logoutOverlay">
    <div class="logo">🔥 ApexVault</div>
    <p>Logging out...</p>
  </div>

  <!-- ========== MOBILE HEADER ========== -->
  <header class="app-header">
    <button class="header-btn" onclick="toggleMobileSidebar()">☰</button>
    <div class="header-title">ApexVault</div>
    <button class="header-btn profile-btn" onclick="showSection('overview')">
      <span id="headerAvatar">U</span>
    </button>
  </header>

  <!-- ========== SIDEBAR (Drawer) ========== -->
  <aside class="sidebar" id="sidebar">
    <div class="sidebar-header">
      <div class="logo">🔥 ApexVault</div>
      <button class="close-sidebar" onclick="toggleMobileSidebar()">✕</button>
    </div>

    <div class="sidebar-user">
      <div class="user-avatar" id="userAvatar">U</div>
      <div class="user-info">
        <h4 id="userName">User</h4>
        <p id="userEmail">user@email.com</p>
      </div>
    </div>

    <nav class="sidebar-nav">
      <button class="nav-item active" onclick="showSection('overview'); toggleMobileSidebar()">
        <span class="icon">📊</span> Overview
      </button>
      <button class="nav-item" onclick="showSection('invest'); toggleMobileSidebar()">
        <span class="icon">📈</span> Invest
      </button>
      <button class="nav-item" onclick="showSection('deposit'); toggleMobileSidebar()">
        <span class="icon">💰</span> Deposit
      </button>
      <button class="nav-item" onclick="showSection('withdraw'); toggleMobileSidebar()">
        <span class="icon">💸</span> Withdraw
      </button>
      <button class="nav-item" onclick="showSection('transfer'); toggleMobileSidebar()">
        <span class="icon">🔄</span> Transfer
      </button>
      <button class="nav-item" onclick="showSection('history'); toggleMobileSidebar()">
        <span class="icon">📜</span> History
      </button>
      <button class="nav-item" onclick="showSection('referral'); toggleMobileSidebar()">
        <span class="icon">🎁</span> Referral
      </button>
      <button class="nav-item" onclick="showSection('pending'); toggleMobileSidebar()">
        <span class="icon">⏳</span> Pending
      </button>
    </nav>

    <div class="sidebar-footer">
      <button class="logout-btn" onclick="logout()">
        <span class="icon">🚪</span> Log Out
      </button>
    </div>
  </aside>

  <div class="sidebar-backdrop" id="sidebarBackdrop" onclick="toggleMobileSidebar()"></div>

  <!-- ========== MAIN CONTENT ========== -->
  <main class="main-content" id="mainContent">

    <!-- BALANCE CARD (Banking Style) -->
    <div class="balance-card">
      <div class="balance-header">
        <span class="balance-label">Total Balance</span>
        <button class="eye-toggle" id="eyeToggle" onclick="toggleBalanceVisibility()">🙈</button>
      </div>
      <div class="balance-amount" id="balanceWrapper">
        <h1 id="totalBalance">$0.00</h1>
      </div>
      <div class="balance-actions">
        <button class="balance-btn" onclick="showSection('deposit')">
          <span class="b-icon">⬇️</span>
          <span>Add Money</span>
        </button>
        <button class="balance-btn" onclick="showSection('withdraw')">
          <span class="b-icon">⬆️</span>
          <span>Withdraw</span>
        </button>
      </div>
    </div>

    <!-- QUICK ACTIONS GRID -->
    <div class="quick-actions">
      <button class="q-action" onclick="showSection('invest')">
        <div class="q-icon" style="background: rgba(100,255,218,0.15);">📈</div>
        <span>Invest</span>
      </button>
      <button class="q-action" onclick="showSection('deposit')">
        <div class="q-icon" style="background: rgba(16,185,129,0.15);">💰</div>
        <span>Deposit</span>
      </button>
      <button class="q-action" onclick="showSection('withdraw')">
        <div class="q-icon" style="background: rgba(239,68,68,0.15);">💸</div>
        <span>Withdraw</span>
      </button>
      <button class="q-action" onclick="showSection('transfer')">
        <div class="q-icon" style="background: rgba(0,168,232,0.15);">🔄</div>
        <span>Transfer</span>
      </button>
    </div>

    <!-- MINI STATS ROW -->
    <div class="mini-stats">
      <div class="mini-stat">
        <span class="mini-label">Invested</span>
        <span class="mini-value" id="miniInvested">$0.00</span>
      </div>
      <div class="mini-stat">
        <span class="mini-label">Profit</span>
        <span class="mini-value green" id="miniProfit">$0.00</span>
      </div>
      <div class="mini-stat">
        <span class="mini-label">Referrals</span>
        <span class="mini-value" id="miniReferral">$0.00</span>
      </div>
        </div>
            </div>
  </main>

  <!-- ========== BOTTOM NAVIGATION (Mobile App Style) ========== -->
  <nav class="bottom-nav" id="bottomNav">
    <button class="bottom-btn active" data-section="overview" onclick="showSection('overview')">
      <span class="bnav-icon">🏠</span>
      <span class="bnav-label">Home</span>
    </button>
    <button class="bottom-btn" data-section="invest" onclick="showSection('invest')">
      <span class="bnav-icon">📈</span>
      <span class="bnav-label">Invest</span>
    </button>
    <button class="bottom-btn center-btn" onclick="showSection('deposit')">
      <span class="bnav-icon">+</span>
    </button>
    <button class="bottom-btn" data-section="history" onclick="showSection('history')">
      <span class="bnav-icon">📜</span>
      <span class="bnav-label">History</span>
    </button>
    <button class="bottom-btn" data-section="pending" onclick="showSection('pending')">
      <span class="bnav-icon">⏳</span>
      <span class="bnav-label">Pending</span>
    </button>
  </nav>

  <!-- ========== MODALS (Keep all your existing modals exactly as they are) ========== -->
  <!-- Paste your existing invest, deposit, withdraw, transfer modals here unchanged -->

  <!-- ========== HIDE BALANCE SCRIPT ========== -->
  <script>
    let balanceHidden = false;
    let realBalance = '$0.00';

    window.toggleBalanceVisibility = function() {
      const wrapper = document.getElementById('balanceWrapper');
      const eye = document.getElementById('eyeToggle');
      const display = document.getElementById('totalBalance');
      
      balanceHidden = !balanceHidden;
      
      if (balanceHidden) {
        realBalance = display.textContent;
        display.textContent = '****';
        wrapper.classList.add('balance-blur');
        eye.textContent = '👁️';
      } else {
        display.textContent = realBalance;
        wrapper.classList.remove('balance-blur');
        eye.textContent = '🙈';
      }
    };
  </script>

  <!-- ========== FIREBASE DASHBOARD SCRIPT ========== -->
  <script type="module" src="dashboard.js"></script>
</body>
</html>
